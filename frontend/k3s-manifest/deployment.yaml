apiVersion: apps/v1
kind: Deployment
metadata:
  name: fridge-log-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fridge-log-frontend
      template:
        metadata:
          labels:
            app: fridge-log-frontend
        spec:
          containers:
            - name: fridge-log-frontend
              image: fridge-log:latest
              imagePullPolicy: Never
              ports:
                - containerPort: 3000
